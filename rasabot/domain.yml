version: "3.1"

intents:
  - greet
  - list_toys
  - ask_toy_details
  - add_to_cart
  - reserve_entire_order 
  - goodbye

entities:
  - target_group
  - toy_name
  - category_name

slots:
  target_group:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: target_group

  toy_name:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: toy_name

  last_toys:
    type: any
    influence_conversation: false
    mappings:
      - type: custom

  category_name:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: category_name

  selected_category:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  selected_toy_id:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

responses:
  utter_greet:
    - text: "Hi! I can help you find toys 😊"

  utter_goodbye:
    - text: "Goodbye!"

actions:
  - action_list_toys
  - action_toy_details
  - action_add_to_cart
  - action_reserve_entire_order   
  - action_list_categories
  - action_list_toys_by_category