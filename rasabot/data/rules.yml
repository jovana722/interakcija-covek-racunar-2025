version: "3.1"

rules:

- rule: list toys
  steps:
    - intent: list_toys
    - action: action_list_toys

- rule: toy details
  steps:
    - intent: ask_toy_details
    - action: action_toy_details

- rule: add to cart
  steps:
    - intent: add_to_cart
    - action: action_add_to_cart


- rule: list categories
  steps:
    - intent: list_categories
    - action: action_list_categories

- rule: list toys by category
  steps:
    - intent: list_toys_by_category
    - action: action_list_toys_by_category

- rule: reserve entire order
  steps:
    - intent: reserve_entire_order
    - action: action_reserve_entire_order
